plugins {
    id "com.android.application"
}

def lingoVoiceServerUrl = providers.gradleProperty("LINGOVOICE_SERVER_URL")
        .orElse("http://10.0.2.2:4175")
        .get()

android {
    namespace "com.lingovoice.app"
    compileSdk 36

    defaultConfig {
        applicationId "com.lingovoice.app"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "0.1.0"

        buildConfigField "String", "SERVER_URL", "\"${lingoVoiceServerUrl}\""
        testInstrumentationRunner "android.test.InstrumentationTestRunner"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.activity:activity:1.13.0"
    implementation "androidx.webkit:webkit:1.17.0"
    testImplementation "junit:junit:4.13.2"
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ["-Xlint:deprecation"]
}
