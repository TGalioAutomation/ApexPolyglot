# LingoVoice — app + PostgreSQL (ADR-001)
# Chạy:  docker compose up -d --build   → app tại http://localhost:4174
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lingovoice
      POSTGRES_PASSWORD: lingovoice
      POSTGRES_DB: lingovoice
    # Chỉ mở trên loopback của VPS — app nối qua mạng nội bộ compose, không lộ PG ra internet
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lingovoice -d lingovoice"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build: .
    environment:
      DATABASE_URL: postgres://lingovoice:lingovoice@postgres:5432/lingovoice
      MIGRATE_ON_START: "1"
      # APP_ACCESS_USER / APP_ACCESS_PASSWORD / ADMIN_ACCESS_* / key AI: nạp từ .env
    env_file:
      - path: .env
        required: false
    ports:
      - "4174:4174"
    # Audio pregen (859 WAV + manifest) bị .dockerignore loại khỏi image — mount từ host,
    # rsync kèm thư mục cache/ khi deploy; owner 1000:1000 để user `node` ghi được manifest
    volumes:
      - ./cache:/app/cache
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
