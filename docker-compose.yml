services:
  db:
    image: postgres:17-alpine
    container_name: lingopilot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lingopilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lingopilot_dev}
      POSTGRES_DB: ${POSTGRES_DB:-lingopilot}
    volumes:
      - lingopilot_pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lingopilot} -d ${POSTGRES_DB:-lingopilot}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  lingopilot:
    build: .
    container_name: lingopilot
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OPENVOX_API: ${OPENVOX_API_DOCKER:-http://host.docker.internal:8000/v1}
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgres://lingopilot:lingopilot_dev@db:5432/lingopilot}
    ports:
      - "80:4173"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/healthz').then(r=>process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  lingopilot_pgdata:
