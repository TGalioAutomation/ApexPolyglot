openapi: 3.1.0
info:
  title: LingoPilot API
  version: 1.0.0-draft
  description: >-
    Core target production HTTP contract. The extended endpoint catalog is in
    docs/technical-architecture.md and each selected release endpoint must be
    promoted into this contract before implementation. The current local
    prototype exposes /api/*; production uses /v1/*. Level 1-7 is an internal
    evidence-based scale.
  contact:
    name: LingoPilot Engineering
servers:
  - url: https://api.example.com/v1
    description: Production placeholder
  - url: https://staging-api.example.com/v1
    description: Staging placeholder
tags:
  - name: Auth
  - name: Profile
  - name: Learning
  - name: Reviews
  - name: Assessment
  - name: Tutor
  - name: Voice
  - name: Progress
  - name: Notifications
  - name: Content
  - name: Moderation
  - name: Support
  - name: Billing
  - name: Analytics
  - name: Privacy
security:
  - sessionCookie: []
paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a learner account and establish a session
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Account registered and secure session cookie issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate with email and password
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Authenticated and secure session cookie issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/recovery-requests:
    post:
      tags: [Auth]
      summary: Request a single-use password recovery challenge
      operationId: requestPasswordRecovery
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecoveryRequest" }
      responses:
        "202":
          description: Request accepted; response never reveals whether the account exists
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/recovery-confirmations:
    post:
      tags: [Auth]
      summary: Set a new password using a single-use recovery token
      operationId: confirmPasswordRecovery
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecoveryConfirmation" }
      responses:
        "204": { description: Password changed and all existing sessions revoked }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/session:
    get:
      tags: [Auth]
      summary: Get the current session
      operationId: getSession
      security: []
      responses:
        "200":
          description: Session or anonymous state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [Auth]
      summary: Sign out and revoke the current session
      operationId: deleteSession
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Signed out
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/sessions:
    get:
      tags: [Auth]
      summary: List active sessions for the current account
      operationId: listSessions
      responses:
        "200":
          description: Active sessions ordered by most recent activity
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/SessionRecord" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/sessions/{authSessionId}:
    delete:
      tags: [Auth]
      summary: Revoke one account session
      operationId: revokeSession
      parameters:
        - $ref: "#/components/parameters/AuthSessionId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204": { description: Session revoked }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /me/profile:
    get:
      tags: [Profile]
      summary: Get learner profile
      operationId: getProfile
      responses:
        "200":
          description: Learner profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearnerProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
    patch:
      tags: [Profile]
      summary: Update learner profile
      operationId: updateProfile
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated profile
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearnerProfile"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429": { $ref: "#/components/responses/RateLimited" }
  /study-plans/{language}:
    parameters:
      - $ref: "#/components/parameters/LanguagePath"
    get:
      tags: [Learning]
      summary: Get the active 90-day study plan
      operationId: getStudyPlan
      responses:
        "200":
          description: Active plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyPlan"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
    put:
      tags: [Learning]
      summary: Change schedule or language allocation
      operationId: updateStudyPlan
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                dailyMinutes: { type: integer, enum: [15, 25, 35, 50] }
                languageAllocation:
                  $ref: "#/components/schemas/LanguageAllocation"
                studyDays:
                  type: array
                  minItems: 1
                  maxItems: 7
                  uniqueItems: true
                  items: { $ref: "#/components/schemas/Weekday" }
                preferredLocalTime:
                  type: string
                  pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
                  example: "20:30"
                timezone: { type: string, minLength: 1, maxLength: 100, example: Asia/Ho_Chi_Minh }
      responses:
        "200":
          description: Recalculated plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyPlan"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          $ref: "#/components/responses/ValidationError"
        "429": { $ref: "#/components/responses/RateLimited" }
  /today:
    get:
      tags: [Learning]
      summary: Get next-best learning actions for today
      operationId: getToday
      responses:
        "200":
          description: At most three primary tasks
          content:
            application/json:
              schema:
                type: object
                required: [date, day, tasks]
                properties:
                  date: { type: string, format: date }
                  day: { type: integer, minimum: 1, maximum: 90 }
                  tasks:
                    type: array
                    maxItems: 3
                    items:
                      $ref: "#/components/schemas/LearningTask"
                  checkpoint:
                    $ref: "#/components/schemas/CheckpointSummary"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /courses/{language}/path:
    parameters:
      - $ref: "#/components/parameters/LanguagePath"
    get:
      tags: [Learning]
      summary: Get curriculum path
      operationId: getPath
      responses:
        "200":
          description: Versioned curriculum path
          content:
            application/json:
              schema:
                type: object
                required: [language, curriculumVersion, phases]
                properties:
                  language: { $ref: "#/components/schemas/Language" }
                  curriculumVersion: { type: string }
                  phases:
                    type: array
                    items:
                      $ref: "#/components/schemas/PathPhase"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /learning-sessions:
    post:
      tags: [Learning]
      summary: Start a learning session
      operationId: createLearningSession
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lessonId]
              additionalProperties: false
              properties:
                lessonId: { type: string, format: uuid }
                source: { type: string, enum: [today, path, practice, requirement] }
      responses:
        "201":
          description: Session created or idempotently replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningSession"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          $ref: "#/components/responses/Conflict"
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /learning-sessions/{sessionId}:
    get:
      tags: [Learning]
      summary: Get session and resumable state
      operationId: getLearningSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningSession"
        "404":
          $ref: "#/components/responses/NotFound"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /learning-sessions/{sessionId}/attempts:
    post:
      tags: [Learning]
      summary: Submit one exercise attempt
      operationId: createAttempt
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttemptRequest"
      responses:
        "201":
          description: Scored attempt and feedback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttemptResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          $ref: "#/components/responses/ValidationError"
        "429": { $ref: "#/components/responses/RateLimited" }
  /learning-sessions/{sessionId}/complete:
    post:
      tags: [Learning]
      summary: Complete session and schedule reviews
      operationId: completeLearningSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Completion summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCompletion"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          $ref: "#/components/responses/Conflict"
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /assessment-runs:
    post:
      tags: [Assessment]
      summary: Start a placement, weekly, phase, recovery, or challenge assessment
      operationId: createAssessment
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [language, kind]
              additionalProperties: false
              properties:
                language: { $ref: "#/components/schemas/Language" }
                kind: { $ref: "#/components/schemas/AssessmentKind" }
                checkpointId: { type: [string, "null"], format: uuid }
      responses:
        "201":
          description: Assessment without answer keys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentRun"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          $ref: "#/components/responses/Conflict"
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /assessment-runs/{assessmentId}:
    get:
      tags: [Assessment]
      summary: Resume assessment
      operationId: getAssessment
      parameters:
        - $ref: "#/components/parameters/AssessmentId"
      responses:
        "200":
          description: Assessment state without answer keys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentRun"
        "404":
          $ref: "#/components/responses/NotFound"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /assessment-runs/{assessmentId}/attempts:
    post:
      tags: [Assessment]
      summary: Save an assessment response
      operationId: createAssessmentAttempt
      parameters:
        - $ref: "#/components/parameters/AssessmentId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentAttemptRequest"
      responses:
        "201":
          description: Response saved; no correctness leak before submit
          content:
            application/json:
              schema:
                type: object
                required: [attemptId, savedAt]
                properties:
                  attemptId: { type: string, format: uuid }
                  savedAt: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          $ref: "#/components/responses/ValidationError"
        "429": { $ref: "#/components/responses/RateLimited" }
  /assessment-runs/{assessmentId}/submit:
    post:
      tags: [Assessment]
      summary: Finalize deterministic score and learning requirements
      operationId: submitAssessment
      parameters:
        - $ref: "#/components/parameters/AssessmentId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Immutable scoring result and AI-assisted plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          $ref: "#/components/responses/Conflict"
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /learning-requirements:
    get:
      tags: [Learning]
      summary: Get active measurable learning requirements
      operationId: getRequirements
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [active, completed, expired, all], default: active }
      responses:
        "200":
          description: Requirements
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/LearningRequirement" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /tutor/conversations:
    post:
      tags: [Tutor]
      summary: Start a bounded tutor conversation
      operationId: createTutorConversation
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [language, mode, goal]
              additionalProperties: false
              properties:
                language: { $ref: "#/components/schemas/Language" }
                mode: { type: string, enum: [guided, free, explain, retry] }
                goal: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "201":
          description: Conversation created with fixed policy envelope
          content:
            application/json:
              schema:
                type: object
                required: [conversationId, language, mode, turnBudget]
                properties:
                  conversationId: { type: string, format: uuid }
                  language: { $ref: "#/components/schemas/Language" }
                  mode: { type: string }
                  turnBudget: { type: integer, minimum: 1, maximum: 30 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /tutor/conversations/{conversationId}/turns:
    post:
      tags: [Tutor]
      summary: Send a bounded tutor message
      operationId: createTutorMessage
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [language, message]
              additionalProperties: false
              properties:
                language: { $ref: "#/components/schemas/Language" }
                message: { type: string, minLength: 1, maxLength: 4000 }
                mode: { type: string, enum: [guided, free, explain, retry], default: guided }
      responses:
        "200":
          description: Structured tutor response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TutorReply"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"
  /voice/capabilities:
    get:
      tags: [Voice]
      summary: Get capability status without secrets
      operationId: getVoiceStatus
      security: []
      parameters:
        - $ref: "#/components/parameters/Language"
      responses:
        "200":
          description: Voice capability status
          content:
            application/json:
              schema:
                type: object
                required: [tts, asr, analysis]
                properties:
                  tts: { type: string, enum: [available, degraded, unavailable] }
                  asr: { type: string, enum: [available, degraded, unavailable] }
                  analysis: { type: string, enum: [available, degraded, unavailable] }
                  disclosure: { type: string }
  /voice/synthesis:
    post:
      tags: [Voice]
      summary: Synthesize speech through consent-compatible provider
      operationId: createSpeech
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [language, text]
              additionalProperties: false
              properties:
                language: { $ref: "#/components/schemas/Language" }
                text: { type: string, minLength: 1, maxLength: 2000 }
                voiceId: { type: string, maxLength: 100 }
      responses:
        "200":
          description: Audio stream
          headers:
            X-Voice-Provider:
              schema: { type: string }
          content:
            audio/wav:
              schema: { type: string, contentEncoding: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          $ref: "#/components/responses/ProviderUnavailable"
  /media/uploads:
    post:
      tags: [Voice]
      summary: Create a short-lived signed upload for consented audio
      operationId: createVoiceUpload
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose, mimeType, bytes]
              additionalProperties: false
              properties:
                purpose: { type: string, enum: [speech_attempt, assessment, conversation] }
                mimeType: { type: string, enum: [audio/webm, audio/wav, audio/mp4] }
                bytes: { type: integer, minimum: 1, maximum: 15000000 }
      responses:
        "201":
          description: Signed upload valid for at most five minutes
          content:
            application/json:
              schema:
                type: object
                required: [uploadId, uploadUrl, expiresAt]
                properties:
                  uploadId: { type: string, format: uuid }
                  uploadUrl: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /progress/summary:
    get:
      tags: [Progress]
      summary: Get evidence-based progress
      operationId: getProgressSummary
      responses:
        "200":
          description: Progress by language and skill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressSummary"
