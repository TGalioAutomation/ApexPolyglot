        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "202":
          description: Export job accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivacyJob" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /me:
    delete:
      tags: [Privacy]
      summary: Request account and personal data deletion
      operationId: createDeletion
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation]
              additionalProperties: false
              properties:
                confirmation: { type: string, const: DELETE }
      responses:
        "202":
          description: Deletion job accepted with cooling-off policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivacyJob" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-lingopilot_session
      description: Secure, HttpOnly, SameSite cookie; state-changing requests also require CSRF protection.
  parameters:
    Language:
      name: language
      in: query
      required: true
      schema: { $ref: "#/components/schemas/Language" }
    LanguagePath:
      name: language
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Language" }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AssessmentId:
      name: assessmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AuthSessionId:
      name: authSessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReviewId:
      name: reviewId
      in: path
      required: true
      schema: { type: string, format: uuid }
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ContentId:
      name: contentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CaseId:
      name: caseId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string }
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Double-submit token bound to the authenticated session; required on every cookie-authenticated mutation.
      schema: { type: string, minLength: 32, maxLength: 256 }
    WebhookSignature:
      name: X-Webhook-Signature
      in: header
      required: true
      description: Provider signature over the exact raw request body and timestamp.
      schema: { type: string, minLength: 16, maxLength: 1024 }
    WebhookTimestamp:
      name: X-Webhook-Timestamp
      in: header
      required: true
      description: Unix epoch seconds used for replay-window enforcement.
      schema: { type: integer, minimum: 1 }
  responses:
    BadRequest:
      description: Malformed syntax, unsupported media, or invalid transport metadata
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Authentication required
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Authenticated but missing consent, role, scope, entitlement, or valid CSRF token
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Resource not found or not visible to caller
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: State or version conflict
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ValidationError:
      description: Request validation failed
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    RateLimited:
      description: Rate or budget limit reached
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ProviderUnavailable:
      description: AI or voice provider unavailable; client may use documented fallback
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Language:
      type: string
      enum: [en, zh-CN]
    Role:
      type: string
      enum: [learner, content_editor, learning_reviewer, support, moderator, billing_admin, auditor, admin]
    Scope:
      type: string
      enum:
        - learning:self
        - support:self
        - billing:self
        - analytics:write:self
        - content:read
        - content:write
        - content:publish
        - moderation:read
        - moderation:write
        - support:read
        - support:write
        - billing:read
        - billing:write
        - audit:read
    AssessmentKind:
      type: string
      enum: [placement, weekly, phase, recovery, challenge]
    Session:
      type: object
      required: [authenticated, expiresAt, roles, scopes]
      properties:
        authenticated: { type: boolean }
        userId: { type: [string, "null"], format: uuid }
        expiresAt: { type: [string, "null"], format: date-time }
        csrfToken:
          type: [string, "null"]
          description: Non-secret token echoed in X-CSRF-Token on authenticated mutations.
        roles: { type: array, uniqueItems: true, items: { $ref: "#/components/schemas/Role" } }
        scopes: { type: array, uniqueItems: true, items: { $ref: "#/components/schemas/Scope" } }
    RegisterRequest:
      type: object
      required: [email, password, locale, timezone, acceptedTermsVersion]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
        locale: { type: string, enum: [vi, en, zh-CN] }
        timezone: { type: string, minLength: 1, maxLength: 100 }
        acceptedTermsVersion: { type: string, minLength: 1, maxLength: 50 }
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 128, writeOnly: true }
    RecoveryRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
    RecoveryConfirmation:
      type: object
      required: [token, newPassword]
      additionalProperties: false
      properties:
        token: { type: string, minLength: 32, maxLength: 2048, writeOnly: true }
        newPassword: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
    AuthResult:
      type: object
      required: [userId, session]
      additionalProperties: false
      properties:
        userId: { type: string, format: uuid }
        session: { $ref: "#/components/schemas/Session" }
    SessionRecord:
      type: object
      required: [id, createdAt, lastSeenAt, current]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        current: { type: boolean }
        deviceLabel: { type: string, maxLength: 200 }
        approximateLocation: { type: string, maxLength: 200 }
    LearnerProfile:
      type: object
      required: [id, version, locale, languages, goal, dailyMinutes]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        locale: { type: string, enum: [vi, en, zh-CN] }
        timezone: { type: string, example: Asia/Ho_Chi_Minh }
        languages:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/Language" }
        goal: { type: string, maxLength: 500 }
        dailyMinutes: { type: integer, enum: [15, 25, 35, 50] }
        correctionStyle: { type: string, enum: [gentle, balanced, direct] }
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      properties:
        locale: { type: string, enum: [vi, en, zh-CN] }
        timezone: { type: string, maxLength: 100 }
        goal: { type: string, maxLength: 500 }
        dailyMinutes: { type: integer, enum: [15, 25, 35, 50] }
        correctionStyle: { type: string, enum: [gentle, balanced, direct] }
    LanguageAllocation:
      type: object
      required: [en, "zh-CN"]
      additionalProperties: false
      properties:
        en: { type: integer, minimum: 0, maximum: 100 }
        "zh-CN": { type: integer, minimum: 0, maximum: 100 }
      description: Values must sum to 100.
      x-validation: en + zh-CN = 100
      x-validation-rule-id: allocation-sum-100-v1
    Weekday:
      type: string
      enum: [mon, tue, wed, thu, fri, sat, sun]
    ScheduledStudyDay:
      type: object
      required: [date, localStart, timezone, plannedMinutes]
      properties:
        date: { type: string, format: date }
        localStart: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        timezone: { type: string }
        plannedMinutes: { type: integer, enum: [15, 25, 35, 50] }
    StudyPlan:
      type: object
      required: [id, version, startDate, durationDays, dailyMinutes, languageAllocation, studyDays, preferredLocalTime, timezone, schedulePreview]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        startDate: { type: string, format: date }
        durationDays: { type: integer, const: 90 }
        dailyMinutes: { type: integer, enum: [15, 25, 35, 50] }
        languageAllocation: { $ref: "#/components/schemas/LanguageAllocation" }
        studyDays:
          type: array
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items: { $ref: "#/components/schemas/Weekday" }
        preferredLocalTime: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        timezone: { type: string }
        schedulePreview: { type: array, items: { $ref: "#/components/schemas/ScheduledStudyDay" } }
        nextRecalculationAt: { type: string, format: date-time }
    LearningTask:
      type: object
      required: [id, type, language, title, minutes, reason, successCriterion]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [lesson, review, checkpoint, conversation, recovery] }
        language: { $ref: "#/components/schemas/Language" }
        title: { type: string }
        minutes: { type: integer, minimum: 1, maximum: 50 }
        reason: { type: string }
        successCriterion: { type: string }
        deepLink: { type: string }
    CheckpointSummary:
      type: [object, "null"]
      properties:
        id: { type: string, format: uuid }
        dueAt: { type: string, format: date-time }
        kind: { $ref: "#/components/schemas/AssessmentKind" }
    PathPhase:
      type: object
      required: [id, title, dayStart, dayEnd, units]
      properties:
        id: { type: string }
        title: { type: string }
        dayStart: { type: integer, minimum: 1, maximum: 90 }
        dayEnd: { type: integer, minimum: 1, maximum: 90 }
        units: { type: array, items: { $ref: "#/components/schemas/PathUnit" } }
    PathUnit:
      type: object
      required: [id, canDo, state]
      properties:
        id: { type: string, format: uuid }
        canDo: { type: string }
        state: { type: string, enum: [locked, available, in_progress, review_due, mastered] }
    LearningSession:
      type: object
      required: [id, lessonId, state, startedAt, currentStep, contentVersion]
      properties:
        id: { type: string, format: uuid }
        lessonId: { type: string, format: uuid }
        state: { type: string, enum: [active, completed, abandoned] }
        startedAt: { type: string, format: date-time }
        currentStep: { type: integer, minimum: 0 }
        contentVersion: { type: string }
        exercises: { type: array, items: { type: object, additionalProperties: true } }
    AttemptRequest:
      type: object
      required: [exerciseId, response, clientAttemptId]
      additionalProperties: false
      properties:
        exerciseId: { type: string, format: uuid }
        clientAttemptId: { type: string, format: uuid }
        response: { type: object, additionalProperties: true }
        elapsedMs: { type: integer, minimum: 0, maximum: 3600000 }
    AttemptResult:
      type: object
      required: [attemptId, score, feedback, retryRequired]
      properties:
        attemptId: { type: string, format: uuid }
        score: { type: number, minimum: 0, maximum: 1 }
        feedback: { $ref: "#/components/schemas/Feedback" }
        retryRequired: { type: boolean }
    Feedback:
      type: object
      required: [worked, priorityFix, betterVersion, explanation, retryPrompt]
      properties:
        worked: { type: string }
        priorityFix: { type: string }
        betterVersion: { type: string }
        explanation: { type: string }
        retryPrompt: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
    SessionCompletion:
      type: object
      required: [sessionId, meaningfulSeconds, evidenceIds, scheduledReviews]
      properties:
        sessionId: { type: string, format: uuid }
        meaningfulSeconds: { type: integer, minimum: 0 }
        evidenceIds: { type: array, items: { type: string, format: uuid } }
        scheduledReviews: { type: integer, minimum: 0 }
        nextTask: { anyOf: [{ $ref: "#/components/schemas/LearningTask" }, { type: "null" }] }
    AssessmentRun:
      type: object
      required: [id, language, kind, state, blueprintVersion, rubricVersion, items]
      properties:
        id: { type: string, format: uuid }
        language: { $ref: "#/components/schemas/Language" }
        kind: { $ref: "#/components/schemas/AssessmentKind" }
        state: { type: string, enum: [active, submitted, expired] }
        blueprintVersion: { type: string }
        rubricVersion: { type: string }
        expiresAt: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: "#/components/schemas/AssessmentItem" }
    AssessmentItem:
      type: object
      required: [id, modality, type, prompt]
      properties:
        id: { type: string, format: uuid }
        modality: { type: string, enum: [listening, reading, speaking, writing] }
        type: { type: string, enum: [choice, dictation, ordered_chunks, open, audio_response] }
        prompt: { type: string }
        choices: { type: array, items: { type: string } }
        media: { type: object, additionalProperties: true }
      description: Never contains answer key or scoring weights.
    AssessmentAttemptRequest:
      type: object
      required: [itemId, response, clientAttemptId]
      additionalProperties: false
      properties:
        itemId: { type: string, format: uuid }
        response: { type: object, additionalProperties: true }
        clientAttemptId: { type: string, format: uuid }
    AssessmentResult:
      type: object
      required:
        - assessmentId
        - overall
        - level
        - estimatedLevel
        - skills
        - evidenceStatus
        - confidence
        - standardError
        - recommendedStartUnit
        - dimensionCaveats
        - requirements
      properties:
        assessmentId: { type: string, format: uuid }
        overall: { type: integer, minimum: 0, maximum: 100 }
        level:
          type: [integer, "null"]
          minimum: 1
          maximum: 7
          description: Verified internal Level; null until promotion policy has sufficient evidence.
        estimatedLevel:
          type: integer
          minimum: 1
          maximum: 7
          description: Preliminary routing estimate; never grants progression or certification.
        skills:
          type: object
          additionalProperties: { type: integer, minimum: 0, maximum: 100 }
        evidenceStatus: { type: string, enum: [preliminary, verified, insufficient] }
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: Calibrated confidence in the reported internal level, not a probability of learner success.
        standardError:
          type: number
          minimum: 0
          maximum: 100
          description: Standard error of measurement on the 0-100 overall scale.
        recommendedStartUnit:
          type: object
          required: [unitId, rationale]
          additionalProperties: false
          properties:
            unitId:
              type: string
              pattern: "^(EN|ZH-CN)-L0[1-7]-D[0-9]{3}-U01$"
            rationale: { type: string, minLength: 1, maxLength: 1000 }
        dimensionCaveats:
          type: object
          required: [listening, reading, speaking]
          additionalProperties: false
          properties:
            listening: { type: [string, "null"], maxLength: 500 }
            reading: { type: [string, "null"], maxLength: 500 }
            speaking: { type: [string, "null"], maxLength: 500 }
          description: Null means no known caveat; text explains missing, low-quality, or non-comparable evidence.
        scoringVersion: { type: string }
        requirements:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/LearningRequirement" }
    LearningRequirement:
      type: object
      required: [id, skill, reason, title, minutes, successCriterion, status]
      properties:
        id: { type: string, format: uuid }
        skill: { type: string }
        reason: { type: string }
        title: { type: string }
        minutes: { type: integer, minimum: 1, maximum: 50 }
        successCriterion: { type: string }
        status: { type: string, enum: [active, completed, expired, superseded] }
        dueAt: { type: [string, "null"], format: date-time }
    TutorReply:
      type: object
      required: [conversationId, reply, feedback, retryPrompt, providerClass]
      properties:
        conversationId: { type: string, format: uuid }
        reply: { type: string }
        feedback: { $ref: "#/components/schemas/Feedback" }
        retryPrompt: { type: string }
        providerClass: { type: string, enum: [primary, fallback, deterministic] }
        modelVersion: { type: string }
        promptVersion: { type: string }
    ProgressSummary:
      type: object
      required: [day, meaningfulMinutes, streak, languages]
      properties:
        day: { type: integer, minimum: 1, maximum: 90 }
        meaningfulMinutes: { type: integer, minimum: 0 }
        streak: { type: integer, minimum: 0 }
        languages:
          type: object
          additionalProperties:
            type: object
            properties:
              internalLevel: { type: integer, minimum: 1, maximum: 7 }
              levelEvidenceStatus: { type: string, enum: [insufficient, collecting, verified] }
              skills: { type: object, additionalProperties: { type: number, minimum: 0, maximum: 1 } }
    ReviewCard:
      type: object
      required: [id, language, prompt, responseMode, dueAt, stability, difficulty, reviewCount]
      properties:
        id: { type: string, format: uuid }
        language: { $ref: "#/components/schemas/Language" }
        prompt: { type: string, minLength: 1 }
        responseMode: { type: string, enum: [recognition, recall, listening, speaking] }
        mediaUrl: { type: string, format: uri }
        dueAt: { type: string, format: date-time }
        stability: { type: number, minimum: 0 }
        difficulty: { type: number, minimum: 0, maximum: 1 }
        reviewCount: { type: integer, minimum: 0 }
    ReviewAttemptRequest:
      type: object
      required: [rating, response, elapsedMs, schedulerVersion]
      additionalProperties: false
      properties:
        rating: { type: string, enum: [again, hard, good, easy] }
        response: { type: object, additionalProperties: true }
        elapsedMs: { type: integer, minimum: 0, maximum: 3600000 }
        schedulerVersion: { type: string, minLength: 1, maxLength: 100 }
    ReviewAttemptResult:
      type: object
      required: [attemptId, evidenceId, nextDueAt, intervalDays, schedulerVersion]
      properties:
        attemptId: { type: string, format: uuid }
        evidenceId: { type: string, format: uuid }
        nextDueAt: { type: string, format: date-time }
        intervalDays: { type: number, minimum: 0 }
        schedulerVersion: { type: string }
    Notification:
      type: object
      required: [id, type, title, body, createdAt, read]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [review_due, checkpoint_due, streak_risk, plan_changed, billing, system] }
        title: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, minLength: 1, maxLength: 2000 }
        deepLink: { type: string, maxLength: 500 }
        createdAt: { type: string, format: date-time }
        read: { type: boolean }
        readAt: { type: [string, "null"], format: date-time }
    NotificationPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Notification" } }
        nextCursor: { type: [string, "null"] }
    NotificationPreferences:
      type: object
      required: [inApp, email, push, quietHours]
      additionalProperties: false
      properties:
        inApp: { type: boolean }
        email: { type: boolean }
        push: { type: boolean }
        quietHours:
          type: object
          required: [enabled, start, end, timezone]
          additionalProperties: false
          properties:
            enabled: { type: boolean }
            start: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
            end: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
            timezone: { type: string, minLength: 1, maxLength: 100 }
    ContentStatus:
      type: string
      enum: [draft, in_review, approved, published, retired]
    ContentDraftRequest:
      type: object
      required: [language, type, title, body, learningObjectives]
      additionalProperties: false
      properties:
        language: { $ref: "#/components/schemas/Language" }
        type: { type: string, enum: [unit, lesson, exercise, rubric, assessment_item] }
        title: { type: string, minLength: 1, maxLength: 300 }
        body: { type: object, additionalProperties: true }
        learningObjectives:
          type: array
          minItems: 1
          items: { type: string, minLength: 1, maxLength: 500 }
        prerequisiteIds: { type: array, uniqueItems: true, items: { type: string, format: uuid } }
    ContentItem:
      allOf:
        - $ref: "#/components/schemas/ContentDraftRequest"
        - type: object
          required: [id, version, status, createdBy, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            version: { type: integer, minimum: 1 }
            status: { $ref: "#/components/schemas/ContentStatus" }
            createdBy: { type: string, format: uuid }
            submittedBy: { type: [string, "null"], format: uuid }
            assignedReviewerId: { type: [string, "null"], format: uuid }
            reviewDecisionId: { type: [string, "null"], format: uuid }
            publishedBy: { type: [string, "null"], format: uuid }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            publishedAt: { type: [string, "null"], format: date-time }
    ContentReviewAssignment:
      type: object
      required: [id, contentId, version, createdBy, reviewerId, status, assignedAt]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        contentId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        createdBy: { type: string, format: uuid }
        reviewerId: { type: string, format: uuid }
        status: { type: string, enum: [assigned, decided, cancelled] }
        assignedAt: { type: string, format: date-time }
      description: reviewerId must differ from createdBy; enforced transactionally by the server.
    ContentReviewDecision:
      type: object
      required: [id, assignmentId, reviewerId, decision, comment, decidedAt]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        assignmentId: { type: string, format: uuid }
        reviewerId: { type: string, format: uuid }
        decision: { type: string, enum: [approved, changes_requested, rejected] }
        comment: { type: string, minLength: 1, maxLength: 2000 }
        decidedAt: { type: string, format: date-time }
        consumedAt: { type: [string, "null"], format: date-time }
    ReportRequest:
      type: object
      required: [category, description]
      additionalProperties: false
      properties:
        category: { type: string, enum: [unsafe_ai, harassment, privacy, copyright, incorrect_content, billing, other] }
        description: { type: string, minLength: 1, maxLength: 5000 }
        resourceType: { type: string, enum: [tutor_turn, lesson, exercise, assessment, user, payment, other] }
        resourceId: { type: string, maxLength: 200 }
    SupportTicketRequest:
      type: object
      required: [subject, description]
      additionalProperties: false
      properties:
        subject: { type: string, minLength: 1, maxLength: 300 }
        description: { type: string, minLength: 1, maxLength: 10000 }
        category: { type: string, enum: [account, learning, technical, billing, privacy, safety, other] }
    CaseStatus:
      type: string
      enum: [open, triaged, investigating, waiting_for_user, resolved, dismissed]
    CaseRecord:
      type: object
      required: [id, kind, status, severity, createdAt, version]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [report, support, safety] }
        status: { $ref: "#/components/schemas/CaseStatus" }
        severity: { type: string, enum: [low, medium, high, critical] }
        assigneeId: { type: [string, "null"], format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    CaseUpdateRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        status: { $ref: "#/components/schemas/CaseStatus" }
        severity: { type: string, enum: [low, medium, high, critical] }
        assigneeId: { type: [string, "null"], format: uuid }
        reason: { type: string, minLength: 1, maxLength: 2000 }
    BillingPlan:
      type: object
      required: [id, name, currency, unitAmount, interval, features]
      properties:
        id: { type: string }
        name: { type: string }
        currency: { type: string, pattern: "^[A-Z]{3}$", example: VND }
        unitAmount: { type: integer, minimum: 0, description: Amount in the currency minor unit. }
        interval: { type: string, enum: [month, year, one_time] }
        features: { type: array, items: { type: string } }
    CheckoutRequest:
      type: object
      required: [planId, successUrl, cancelUrl]
      additionalProperties: false
      properties:
        planId: { type: string, minLength: 1, maxLength: 100 }
        successUrl: { type: string, format: uri, maxLength: 2048 }
        cancelUrl: { type: string, format: uri, maxLength: 2048 }
        promotionCode: { type: string, maxLength: 100 }
    CheckoutSession:
      type: object
      required: [id, url, expiresAt]
      properties:
        id: { type: string }
        url: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
    Subscription:
      type: object
      required: [tier, status, cancelAtPeriodEnd]
      properties:
        id: { type: [string, "null"] }
        tier: { type: string, enum: [free, pro, team] }
        status: { type: string, enum: [none, trialing, active, past_due, paused, canceled] }
        currentPeriodEnd: { type: [string, "null"], format: date-time }
        cancelAtPeriodEnd: { type: boolean }
        provider: { type: [string, "null"], enum: [stripe, manual, null] }
    Entitlement:
      type: object
      required: [key, enabled, source]
      properties:
        key: { type: string, pattern: "^[a-z][a-z0-9_.-]+$" }
        enabled: { type: boolean }
        limit: { type: [integer, "null"], minimum: 0 }
        source: { type: string, enum: [free, subscription, grant, promotion] }
        expiresAt: { type: [string, "null"], format: date-time }
    AnalyticsBatch:
      type: object
      required: [schemaVersion, sentAt, events]
      additionalProperties: false
      properties:
        schemaVersion: { type: string, minLength: 1, maxLength: 50 }
        sentAt: { type: string, format: date-time }
        events:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/AnalyticsEvent" }
    AnalyticsEvent:
      type: object
      required: [id, name, occurredAt, anonymousId, properties]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        name: { type: string, pattern: "^[a-z][a-z0-9_.]{1,99}$" }
        occurredAt: { type: string, format: date-time }
        anonymousId: { type: string, minLength: 16, maxLength: 128 }
        properties:
          type: object
          maxProperties: 30
          additionalProperties:
            type: [string, number, integer, boolean, "null"]
      description: Must not contain raw transcript, audio, email, access token, or free-form personal data.
    ConsentRecord:
      type: object
      required: [type, granted, policyVersion, updatedAt]
      properties:
        type: { type: string }
        granted: { type: boolean }
        policyVersion: { type: string }
        updatedAt: { type: string, format: date-time }
        source: { type: string, enum: [onboarding, settings, support, migration] }
    PrivacyJob:
      type: object
      required: [id, type, status, requestedAt]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [export, deletion] }
        status: { type: string, enum: [queued, processing, completed, failed, cancelled] }
        requestedAt: { type: string, format: date-time }
        completionTarget: { type: string, format: date-time }
    Problem:
      type: object
      required: [type, title, status, code, requestId]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        code: { type: string, pattern: "^[A-Z0-9_]+$" }
        detail: { type: string }
        requestId: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
